<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>QA harness</title>
<style>body{font:13px/1.5 monospace;background:#111;color:#ddd;margin:0;padding:8px}iframe{border:0;display:block;background:#fff}</style>
</head>
<body>
<iframe id="f" width="360" height="640"></iframe>
<script>
window.__qa = { done: false, results: [], phase: 'idle' };

var PAGES = ['index.html', 'story.html', 'records.html'];
var WIDTHS = [360, 414, 768, 900, 1140, 1280, 1440];
var LANGS = ['ar', 'en', 'ru'];
var ALLOWED_LATIN_AR = [
  'LinkedIn', 'GitHub', 'YouTube', 'VK', 'EN', 'RU', 'Ç', 'ç'
];

function latinHits(text) {
  // Latin letters in an Arabic UI — allow the approved brand names only
  var cleaned = text;
  ALLOWED_LATIN_AR.forEach(function (w) { cleaned = cleaned.split(w).join(''); });
  var m = cleaned.match(/[A-Za-z]{2,}/g);
  return m ? m.slice(0, 6) : [];
}
function cjkHits(text) {
  var m = text.match(/[\u3040-\u30ff\u4e00-\u9fff\uac00-\ud7af]+/g);
  return m ? m.slice(0, 4) : [];
}
function walkText(root) {
  var out = [];
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      var p = n.parentElement;
      if (!p) return NodeFilter.FILTER_REJECT;
      var tag = p.tagName;
      if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TITLE' || tag === 'META') return NodeFilter.FILTER_REJECT;
      if (p.getAttribute && p.getAttribute('aria-hidden') === 'true') return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  var n;
  while ((n = walker.nextNode())) out.push(n.nodeValue);
  return out;
}

/* The harness window is far narrower than the widest case (484px here vs a
   1440px case). An iframe wider than its window is CLIPPED by the browser,
   and IntersectionObserver reports intersections against the clipped area —
   so an element that is plainly inside the page still reports
   isIntersecting:false. Every on-screen test below therefore measures
   against the visible slice (min of the page width and the window width),
   not the nominal case width. */
function visibleWidth(win, width) {
  return Math.max(1, Math.min(width, win.innerWidth || width));
}

function inspect(doc, win, width, lang, page, frames) {
  var r = { page: page, lang: lang, width: width, issues: [], notes: [] };
  var vw = visibleWidth(win, width);
  var add = function (k, v) { r.issues.push(k + '=' + JSON.stringify(v)); };
  /* This browser window is headless/hidden: when no animation frames are
     produced, IntersectionObserver callbacks and rAF never run, so every
     scroll-driven check would be a false alarm. Those are skipped and
     reported as a note instead of as an issue. */
  if (!frames) { /* the reason is added by done1(), which knows which of the
                    two conditions failed: framesOff or windowTooNarrow */ }

  var d = doc.documentElement;
  /* overflow is a property of the LAYOUT, not of the visible slice: the page
     must not scroll sideways at its own nominal width, even though this
     window can only show part of it */
  var overflow = d.scrollWidth - Math.max(d.clientWidth, width);
  if (overflow > 1) add('hOverflow', overflow);

  // any element sticking out horizontally (against the page's own width)
  var wide = [];
  var els = doc.querySelectorAll('body *');
  for (var i = 0; i < els.length; i++) {
    var e = els[i];
    if (e.tagName === 'HTML' || e.tagName === 'BODY') continue;
    var cs = win.getComputedStyle(e);
    if (cs.position === 'fixed' || cs.display === 'none' || cs.visibility === 'hidden') continue;
    var b = e.getBoundingClientRect();
    if (b.width === 0 && b.height === 0) continue;
    // the marquee is MEANT to run past the viewport (its band clips it)
    if (e.closest('.marquee')) continue;
    if (b.right > width + 1.5 || b.left < -1.5) {
      wide.push(e.tagName.toLowerCase() + '.' + (e.className || '').toString().split(' ')[0] + '[' + Math.round(b.left) + ',' + Math.round(b.right) + ']');
    }
    if (wide.length > 5) break;
  }
  if (wide.length) add('outOfBounds', wide);

  var h1s = doc.querySelectorAll('h1');
  if (h1s.length !== 1) add('h1', h1s.length);

  var text = walkText(doc.body).join(' \n ');
  if (lang === 'ar') {
    var lh = latinHits(text);
    if (lh.length) add('latinInArabic', lh);
  }
  var cj = cjkHits(text);
  if (cj.length) add('cjk', cj);

  // dead anchors
  var dead = [];
  doc.querySelectorAll('a[href^="#"]').forEach(function (a) {
    var id = a.getAttribute('href').slice(1);
    if (id && !doc.getElementById(id)) dead.push(a.getAttribute('href'));
  });
  if (dead.length) add('deadAnchors', dead);

  // tiny tap targets on visible interactive elements
  var tiny = [];
  doc.querySelectorAll('a, button').forEach(function (a) {
    var b = a.getBoundingClientRect();
    if (b.width === 0 || b.height === 0) return;
    if (b.height < 40) tiny.push((a.textContent || '').trim().slice(0, 18) + ':' + Math.round(b.height));
  });
  if (tiny.length) add('smallTargets', tiny.slice(0, 8));

  // language plumbing
  if (doc.documentElement.lang !== lang) add('htmlLang', doc.documentElement.lang);
  var expectDir = lang === 'ar' ? 'rtl' : 'ltr';
  if (doc.documentElement.dir !== expectDir) add('dir', doc.documentElement.dir);

  // premium layer markers
  if (page === 'index.html') {
    var heads = doc.querySelectorAll('.sec-head');
    var idx = doc.querySelectorAll('.sec-index');
    if (idx.length !== heads.length) add('secIndex', idx.length + '/' + heads.length);
    var track = doc.querySelector('.marquee-track');
    if (!track || track.children.length < 2) add('marquee', track ? track.children.length : 'none');
    var words = track ? track.textContent.trim() : '';
    if (words.length < 10) add('marqueeWords', words);
    // "stuck at zero" only counts if the row is ON SCREEN — the counters
    // are designed to stay at 0 until they scroll into view (IO-driven,
    // so only meaningful when the window renders frames)
    var sr = doc.getElementById('stat-row');
    if (sr && frames) {
      var sb = sr.getBoundingClientRect();
      var onScreen = sb.top < win.innerHeight * 0.95 && sb.bottom > 0;
      var nums = [].map.call(doc.querySelectorAll('.stat-num'), function (n) { return n.textContent; });
      if (onScreen && nums.join(',') === '0,0,0') add('statStuckAtZero', nums);
    }
  }
  if (!doc.querySelector('.read-progress')) add('progress', 'missing');
  if (!doc.querySelector('.footer-mark')) add('footerMark', 'missing');
  else if (doc.querySelector('.footer-mark').textContent.trim().length < 3) add('footerMark', 'empty');
  else if (doc.querySelector('.footer-mark').getAttribute('aria-hidden') !== 'true') add('footerMark', 'notHidden');

  // the ghost numeral must be ABSOLUTE — a `.sec-head-row > *` rule with
  // equal specificity would otherwise drop it into the flow
  doc.querySelectorAll('.sec-index').forEach(function (n) {
    if (win.getComputedStyle(n).position !== 'absolute') add('secIndex', 'position:' + win.getComputedStyle(n).position);
  });

  // each switcher button needs a real accessible name, not just ع
  doc.querySelectorAll('.lang-btn').forEach(function (b) {
    var al = b.getAttribute('aria-label');
    if (!al || al.length < 3) add('langBtnAria', (b.dataset.lang || '?') + ':' + al);
  });

  /* Buttons: the label must never be covered.
     A hover gleam used to be a ::after overlay, which painted ON TOP of the
     text and turned "اقرأ قصتي" into a ghost. The fix was to make the gleam
     a background layer — backgrounds always paint under text. This asserts
     that contract so the overlay can never come back. */
  var covered = [];
  doc.querySelectorAll('.btn, .btn-solid, .btn-outline, .record-action, .tag').forEach(function (b) {
    var after = win.getComputedStyle(b, '::after');
    var before = win.getComputedStyle(b, '::before');
    // an overlay pseudo-element that is not the focus ring is a red flag
    if (after.content !== 'none' && after.backgroundImage !== 'none' && /gradient/.test(after.backgroundImage)) {
      covered.push((b.textContent || '').trim().slice(0, 14) + ':after-overlay');
    }
    if (before.content !== 'none' && before.backgroundImage !== 'none' && /gradient/.test(before.backgroundImage)) {
      covered.push((b.textContent || '').trim().slice(0, 14) + ':before-overlay');
    }
    // and the label must have a real box of its own
    var range = doc.createRange();
    range.selectNodeContents(b);
    if (!range.getClientRects().length) covered.push((b.textContent || '').trim().slice(0, 14) + ':no-text-box');
  });
  if (covered.length) add('btnOverlay', covered.slice(0, 6));

  /* THE LINK-COLOUR TRAP, detected in the real browser.
     `a:hover { color }` is (0,1,1) and beats `.btn { color }` (0,1,0), so a
     link that carries its own colour but never re-states it on hover turns
     gold the moment the pointer arrives. On the primary button that made
     "اقرأ قصتي" vanish into its own spectrum. This walks the live CSSOM and
     works out, per element, which declaration wins each state. */
  /* THE LINK-COLOUR TRAP, detected in the live browser.
     `a:hover { color }` is (0,1,1) and beats `.btn { color }` (0,1,0), so a
     link that carries its own colour but never re-states it on hover turns
     gold the moment the pointer arrives. On the primary button that made
     "اقرأ قصتي" vanish into its own spectrum.

     This was proved to work by re-injecting a stronger rule
     (`html body .hero-actions a.btn-primary:hover`) and watching the check
     report exactly `اقرأ قصتي:var(--void)->var(--gold)`.
     It also reports `hoverAuditBlind` if it ever reads zero rules, because a
     check that finds nothing and says "clean" is worse than no check. */
  var swapped = [];
  var colourRules = [];
  try {
    /* Specificity by character-code scanning, with no regular expressions:
       the harness travels as a file, and a mangled escape in transit would
       silently make this check count zero rules and pass everything. */
    function isWordChar(ch) {
      if (ch === '') return false;
      var c = ch.charCodeAt(0);
      return (c >= 48 && c <= 57) || (c >= 65 && c <= 90) ||
             (c >= 97 && c <= 122) || c === 95 || c === 45;
    }
    function specificity(sel) {
      var ids = 0, cls = 0, ps = 0, ty = 0, i = 0;
      while (i < sel.length) {
        var c = sel.charAt(i);
        if (c === '#') { ids++; i++; while (i < sel.length && isWordChar(sel.charAt(i))) i++; continue; }
        if (c === '.') { cls++; i++; while (i < sel.length && isWordChar(sel.charAt(i))) i++; continue; }
        if (c === ':') {
          if (sel.charAt(i + 1) === ':') { i += 2; continue; }
          ps++; i++; while (i < sel.length && isWordChar(sel.charAt(i))) i++; continue;
        }
        if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) {
          var p = sel.charAt(i - 1);
          if (i === 0 || p === ' ' || p === '\t' || p === '\n' ||
              p === '>' || p === '+' || p === '~' || p === ',') ty++;
          while (i < sel.length && isWordChar(sel.charAt(i))) i++; continue;
        }
        i++;
      }
      return ids * 10000 + cls * 100 + ps * 10 + ty;
    }

    /* Walk the CSSOM with plain indexing. `Array.prototype.slice.call()` on a
       CSSRuleList works in some engines and silently yields nothing in
       others — which is how this check ended up reading 0 rules and passing
       every page. An explicit loop cannot fail that way. */
    var flat = [];
    for (var si = 0; si < doc.styleSheets.length; si++) {
      var rules;
      try { rules = doc.styleSheets[si].cssRules; } catch (e) { continue; }
      if (!rules) continue;
      for (var ri = 0; ri < rules.length; ri++) flat.push(rules[ri]);
    }
    r._flat = flat.length;

    /* CSSOM nests: a @media block is ONE top-level rule whose .cssRules
       holds the real declarations. Walking only the top level therefore
       finds almost no colours — that was the blind spot. */
    (function collect(rules) {
      for (var i = 0; i < rules.length; i++) {
        var rule = rules[i];
        /* A grouping rule (@media, @supports) has cssRules AND no
           selectorText. A style rule has selectorText and no cssRules.
           Testing `rule.cssRules` alone is not enough: some engines expose
           an empty-but-present cssRules on style rules, which silently
           sent the walk down an empty branch and found nothing. */
        if (!rule.selectorText && rule.cssRules) { collect(rule.cssRules); continue; }
        if (!rule.selectorText || !rule.style) continue;
        var colourVal = null;
        try { colourVal = rule.style.color; } catch (e) { continue; }
        if (!colourVal) continue;
        rule.selectorText.split(',').forEach(function (part) {
          var sel = part.trim();
          if (!sel) return;
          colourRules.push({
            sel: sel,
            colour: colourVal,
            hover: sel.indexOf(':hover') > -1,
            spec: specificity(sel)
          });
        });
      }
    })(flat);

    function winner(el, hovered) {
      var best = null;
      colourRules.forEach(function (r) {
        if (r.hover !== hovered) return;
        try { if (!el.matches(r.sel.replace(/:hover/g, ''))) return; } catch (e) { return; }
        if (!best || r.spec > best.spec) best = r;
      });
      return best;
    }

    /* Report a swap ONLY when it can actually hurt legibility: a label on a
       BRIGHT, self-painted gradient. Three conditions must all hold:
         1. the colour actually changes
         2. the element paints its own gradient (a spectrum surface)
         3. the hover colour is not the same family as the rest colour —
            i.e. it is a real hue swap, not a one-step brightening
       A link on the dark background brightening on hover is the DESIGN, and
       a near-identical swap (--fg-2 -> --fg) cannot make text vanish. Those
       are left alone; the failure this guards against is gold-on-spectrum. */
    function hueOf(c) { return String(c).replace(/[^a-z0-9(),.\s%#-]/gi, '').toLowerCase(); }

    /* THE LINK-COLOUR TRAP only applies to LINKS. A <button> is not an <a>,
       so `a:hover` cannot touch it — including it here produced a false
       positive on the active language button, which is a <button> with a
       spectrum fill and a near-black label, and is perfectly correct. */
    doc.querySelectorAll('a').forEach(function (el) {
      if (!el.textContent || !el.textContent.trim()) return;
      var rect = el.getBoundingClientRect();
      if (rect.width === 0) return;
      var rest = winner(el, false), hov = winner(el, true);
      if (!rest || !hov || hov.colour === rest.colour) return;

      var own = win.getComputedStyle(el).backgroundImage || '';
      if (own.indexOf('gradient') === -1) return;   // dark surface: intended

      // the dangerous case: a near-black label on a bright spectrum fill
      // that stops being near-black on hover — gold on gold, invisible
      var isVoid = function (c) { return /var\(--void\)/.test(String(c)) || /rgb\(4,\s*5,\s*10\)/.test(String(c)); };
      if (isVoid(rest.colour) && !isVoid(hov.colour)) {
        swapped.push(el.textContent.trim().slice(0, 14) + ':' + rest.colour + '->' + hov.colour);
        return;
      }
      // a deliberate tint on a lit surface: report only a real hue change
      var restHue = hueOf(rest.colour).split('(')[0];
      var hovHue = hueOf(hov.colour).split('(')[0];
      if (restHue && hovHue && restHue !== hovHue) {
        swapped.push(el.textContent.trim().slice(0, 14) + ':' + rest.colour + '->' + hov.colour);
      }
    });
  } catch (e) { r.issues.push('hoverAuditError=' + e.message); }
  if (swapped.length) add('hoverColourSwap', swapped.slice(0, 6));
  /* If this ever reads 0, the check is BLIND — it would pass everything
     while proving nothing. Fail loudly rather than stop working quietly. */
  if (!colourRules.length) add('hoverAuditBlind', '0 of ' + r._flat + ' rules carried a colour');

  // data-i18n that stayed empty
  var empties = [];
  doc.querySelectorAll('[data-i18n]').forEach(function (n) {
    if (!n.textContent.trim()) empties.push(n.getAttribute('data-i18n'));
  });
  if (empties.length) add('emptyI18n', empties.slice(0, 6));

  /* Invisible-but-not-revealed content (stuck at opacity 0).
     The bottom 5% of the height is the reveal zone: items there sit outside
     the observer root on purpose, so they are not counted.
     A reveal only counts as stuck if the item is BOTH vertically on screen
     AND horizontally inside the visible slice — an element clipped off the
     side of this window legitimately never intersects, and that is the
     harness's doing, not the page's. */
  var stuck = [];
  if (frames) {
    doc.querySelectorAll('.reveal:not(.is-in)').forEach(function (n) {
      var b = n.getBoundingClientRect();
      var onScreenVertically = b.top < win.innerHeight * 0.95 && b.bottom > 0;
      var onScreenHorizontally = b.right > 0 && b.left < vw;
      if (onScreenVertically && onScreenHorizontally) stuck.push(n.className.split(' ')[0]);
    });
  }
  if (stuck.length) add('stuckReveal', stuck.slice(0, 5));

  // header budget: the desktop nav must stay on ONE row, and the header
  // row must not overflow its shell at any width
  var hi = doc.querySelector('.header-inner');
  if (hi && hi.scrollWidth > hi.clientWidth + 1) add('headerOverflow', hi.scrollWidth + '/' + hi.clientWidth);
  var navUl = doc.querySelector('.primary-nav ul');
  var toggle = doc.querySelector('.nav-toggle');
  if (navUl && toggle && win.getComputedStyle(toggle).display === 'none') {
    var tops = {};
    navUl.querySelectorAll('a').forEach(function (a) {
      var bb = a.getBoundingClientRect();
      if (bb.width) tops[Math.round(bb.top)] = 1;
    });
    var rows = Object.keys(tops).length;
    if (rows > 1) add('navRows', rows);
  }

  return r;
}

function loadCase(page, lang, width) {
  return new Promise(function (resolve) {
    var f = document.getElementById('f');
    f.width = width;
    f.style.width = width + 'px';
    /* the site lets a saved preference win over ?lang=, so seed the exact
       language for this case — otherwise every case renders the last one */
    try { localStorage.setItem('site-lang', lang); } catch (e) { /* private mode */ }
    var url = 'http://127.0.0.1:8000/' + page + '?lang=' + lang;
    var done = false;
    function finish() {
      if (done) return;
      done = true;
      f.removeEventListener('load', finish);
      // give the scripts a beat to render, then let the page settle:
      // reveals are IntersectionObserver-driven and this browser window
      // is throttled, so wait (bounded) until nothing visible is still
      // waiting to be revealed before inspecting.
      setTimeout(function () {
        var doc, win;
        try { doc = f.contentDocument; win = f.contentWindow; }
        catch (e) { resolve({ page: page, lang: lang, width: width, issues: ['noAccess:' + e.message] }); return; }
        if (!doc || !doc.body) { resolve({ page: page, lang: lang, width: width, issues: ['noDoc'] }); return; }

        function done1(frames) {
          var res;
          try { res = inspect(doc, win, width, lang, page, frames); }
          catch (e) { res = { page: page, lang: lang, width: width, issues: ['inspectError:' + e.message] }; }
          if (!frames) res.notes = (res.notes || []).concat([visibleWidth(win, width) >= width ? 'framesOff' : 'windowTooNarrow']);
          resolve(res);
        }
        /* Are the scroll-driven checks trustworthy in this window?
           Two independent conditions, both required:
             - the document timeline must ADVANCE, or no rendering step runs
               and rAF/IntersectionObserver are silent;
             - the case must FIT the window, or the iframe is clipped and its
               IntersectionObserver stays silent for everything off the clip.
           When either fails, the checks are skipped with a note instead of
           being reported as page bugs. */
        function sampleFrames() {
          var a = doc.timeline ? doc.timeline.currentTime : 0;
          setTimeout(function () {
            var b = doc.timeline ? doc.timeline.currentTime : 0;
            var paints = b > a;
            var fits = visibleWidth(win, width) >= width;
            settle(10, paints && fits, 0, paints && fits);
          }, 800);
        }
        function settle(tries, frames, clean) {
          var pending = 0;
          try {
            /* same visible-slice rule as inspect(): an iframe wider than this
               window is clipped, and its IntersectionObserver stays silent
               for anything off the clip — so an item there is the harness's
               doing, not the page's, and waiting for it would only burn
               the settle budget. */
            var vw = visibleWidth(win, width);
            pending = [].filter.call(doc.querySelectorAll('.reveal:not(.is-in)'), function (n) {
              var b = n.getBoundingClientRect();
              return b.top < win.innerHeight * 0.95 && b.bottom > 0 &&
                     b.right > 0 && b.left < vw;
            }).length;
          } catch (e) { resolve({ page: page, lang: lang, width: width, issues: ['settleError:' + e.message] }); return; }
          /* Two consecutive clean samples are required. A single one is not
             enough: fonts and images can still be landing, so an item may be
             below the fold at the first sample and inside the viewport — and
             therefore legitimately waiting for its observer — at the next. */
          clean = pending ? 0 : (clean || 0) + 1;
          if (!frames || clean >= 2 || tries <= 0) return done1(frames);
          setTimeout(function () { settle(tries - 1, frames, clean); }, 400);
        }
        sampleFrames();
      }, 300);
    }
    f.addEventListener('load', finish);
    f.src = url;
    setTimeout(finish, 6000);
  });
}

/* ---------- single-case probe (dev aid) ----------
   Runs the hover-colour check on ONE page so a fix can be verified in
   seconds instead of waiting for all 63 cases.
   Usage in the console:  await probeOne('index.html', 'ar', 900)          */
window.probeOne = function (page, lang, width) {
  return new Promise(function (resolve) {
    var f = document.getElementById('f');
    f.width = width; f.style.width = width + 'px';
    try { localStorage.setItem('site-lang', lang); } catch (e) { /* private mode */ }
    f.onload = function () {
      setTimeout(function () {
        var doc = f.contentDocument;
        var r;
        try { r = inspect(doc, f.contentWindow, width, lang, page, false); }
        catch (e) { resolve({ page: page, error: e.message }); return; }
        r.page = page + '/' + lang + '/' + width;
        r.ruleCount = r._flat;
        delete r._flat;
        resolve(r);
      }, 1400);
    };
    f.src = '/' + page + '?lang=' + lang + '&cb=' + Date.now();
  });
};

window.runQA = function () {
  window.__qa = { done: false, results: [], phase: 'running' };
  var q = window.__qa;
  var jobs = [];
  PAGES.forEach(function (p) {
    LANGS.forEach(function (l) {
      WIDTHS.forEach(function (w) { jobs.push([p, l, w]); });
    });
  });
  (function next() {
    var job = jobs.shift();
    if (!job) { q.done = true; q.phase = 'done'; return; }
    loadCase(job[0], job[1], job[2]).then(function (res) {
      if (res.issues.length || (res.notes && res.notes.length)) q.results.push(res);
      next();
    });
  })();
  return jobs.length;
};
</script>
</body></html>
