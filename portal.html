<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>البوابة | حسين البسيوني</title>
<meta name="description" content="بوابة حسين البسيوني بين عالميه: اختر عالم الكرة الطائرة أو العالم الأكاديمي والمهني، وادخل إليه.">
<meta name="author" content="حسين البسيوني">
<meta name="theme-color" content="#0A1628">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_AR">
<meta property="og:title" content="البوابة | حسين البسيوني">
<meta property="og:description" content="بوابة حسين البسيوني بين عالميه: اختر عالم الكرة الطائرة أو العالم الأكاديمي والمهني، وادخل إليه.">
<link rel="canonical" href="https://hus-bassi.github.io/hussein-portfolio/portal.html">

<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/portal.css">
<script src="assets/js/motion.js"></script>
<script src="assets/js/tick.js"></script>
<script src="assets/js/field.js"></script>
<script src="assets/js/pointer.js"></script>
<script src="assets/js/intro.js"></script>
</head>

<body data-page="portal">
<a class="skip-link" href="#main" data-i18n="skip">تخطّي إلى المحتوى الرئيسي</a>

<!-- The gateway's header is the brand and the language system, nothing
     else: no section nav, no page chrome. The brand is the way home. -->
<header class="site-header is-stuck" id="site-header">
  <div class="shell header-inner">
    <a class="brand" href="index.html" data-i18n-aria="brand.name" aria-label="حسين البسيوني">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="12" cy="12" r="3.4"></circle>
          <ellipse cx="12" cy="12" rx="10" ry="4.4" transform="rotate(-28 12 12)"></ellipse>
        </svg>
      </span>
      <span class="brand-name" data-i18n="brand.name">حسين البسيوني</span>
    </a>

    <div class="lang-switch" role="group" data-i18n-aria="lang.label" aria-label="اللغة">
      <button class="lang-btn" type="button" data-lang="ar" data-i18n-aria="lang.name.ar" aria-label="العربية" aria-pressed="true">ع</button>
      <button class="lang-btn" type="button" data-lang="en" data-i18n-aria="lang.name.en" aria-label="English" aria-pressed="false">EN</button>
      <button class="lang-btn" type="button" data-lang="ru" data-i18n-aria="lang.name.ru" aria-label="Русский" aria-pressed="false">RU</button>
    </div>
  </div>
</header>

<main id="main">

  <!-- ═══ البوابة — the gateway ═══
       One question, one gate, two doorways. The doors are REAL LINKS to
       the two world pages: a no-JS visitor still gets the same choice,
       ui.js owns the departure, and portal.js only leans the gate and
       lights the world under the pointer. -->
  <section class="gateway" id="gateway" aria-labelledby="gateway-title">
    <div class="hero-sky" aria-hidden="true">
      <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
      <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>
      <span class="star s7"></span><span class="star s8"></span>
    </div>

    <div class="shell gateway-inner">
      <div class="hero-head">
        <p class="eyebrow" data-i18n="portal.eyebrow">بوابة إلى عالمين</p>
        <h1 class="hero-name" id="gateway-title" data-i18n="portal.welcome">مرحبًا بك في عالمي</h1>
      </div>

      <p class="gateway-prompt" data-i18n="portal.ask">أي عالم تريد أن تستكشف؟</p>

      <!-- door | gate | door. `direction: ltr` (portal.css) keeps the
           volleyball door PHYSICALLY left and the academic door PHYSICALLY
           right in all three languages — the pointer axis is physical. -->
      <div class="gateway-stage" role="group" data-i18n-aria="portal.pathsLabel" aria-label="اختر العالم الذي تريد أن تدخل إليه">

        <!-- THE LEFT DOOR — the volleyball world -->
        <a class="portal-door portal-door--volley" href="volleyball.html" data-portal-path="volley" data-i18n-aria="portal.enterVolley" aria-label="ادخل عالم الكرة الطائرة">
          <span class="door-world" aria-hidden="true">
            <span class="portal-orb"></span>
            <span class="portal-court portal-court--a"></span>
            <span class="portal-court portal-court--b"></span>
            <span class="portal-court portal-court--c"></span>
            <svg class="portal-ball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" focusable="false">
              <circle cx="12" cy="12" r="8.4"></circle>
              <path d="M4.6 9.2C10 7 17.8 9.6 19.4 14.8"></path>
              <path d="M4.6 14.8C8.6 20 17.4 17.4 19.4 9.2"></path>
            </svg>
            <span class="door-streak door-streak--a"></span>
            <span class="door-streak door-streak--b"></span>
          </span>
          <span class="portal-door-words">
            <span class="portal-door-name" data-i18n="portal.pathVolley">عالم الكرة الطائرة</span>
            <span class="portal-door-sub" data-i18n="portal.pathVolleySub">حسين — الرياضي</span>
          </span>
        </a>

        <!-- THE GATE — the tunnel toward the light, with the figure's
             slot standing inside it. The slot is a contract: portal.js
             drops one transparent layer per state in when the art
             exists; until then its CSS aura is the rendered state. -->
        <div class="portal">
          <svg class="portal-gate" viewBox="0 0 480 560" fill="none" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="pg-frame" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7C5CFF"></stop>
                <stop offset=".5" stop-color="#F6C445"></stop>
                <stop offset="1" stop-color="#38BDF8"></stop>
              </linearGradient>
              <radialGradient id="pg-warm" cx=".5" cy=".5" r=".5">
                <stop offset="0" stop-color="#F6C445" stop-opacity=".55"></stop>
                <stop offset="1" stop-color="#F6C445" stop-opacity="0"></stop>
              </radialGradient>
              <radialGradient id="pg-cool" cx=".5" cy=".5" r=".5">
                <stop offset="0" stop-color="#38BDF8" stop-opacity=".55"></stop>
                <stop offset="1" stop-color="#38BDF8" stop-opacity="0"></stop>
              </radialGradient>
            </defs>

            <!-- the light at the end of the tunnel: a neutral violet heart,
                 the two world tints laid over it by the pointer -->
            <ellipse class="pg-core pg-core--violet" cx="240" cy="330" rx="60" ry="38"></ellipse>
            <ellipse class="pg-core pg-core--warm" cx="240" cy="330" rx="60" ry="38"></ellipse>
            <ellipse class="pg-core pg-core--cool" cx="240" cy="330" rx="60" ry="38"></ellipse>

            <!-- the tunnel: five recessed ellipses converging on the light -->
            <ellipse class="pg-ring" cx="240" cy="330" rx="168" ry="126"></ellipse>
            <ellipse class="pg-ring" cx="240" cy="330" rx="134" ry="99"></ellipse>
            <ellipse class="pg-ring" cx="240" cy="330" rx="102" ry="73"></ellipse>
            <ellipse class="pg-ring" cx="240" cy="330" rx="72" ry="49"></ellipse>
            <ellipse class="pg-ring" cx="240" cy="330" rx="44" ry="27"></ellipse>

            <!-- the mouth: the outer frame and the inner lip -->
            <path class="pg-frame" d="M40 560 V250 A200 200 0 0 1 440 250 V560" stroke="url(#pg-frame)"></path>
            <path class="pg-lip" d="M92 560 V282 A148 148 0 0 1 388 282 V560" stroke="url(#pg-frame)"></path>

            <!-- the floor the figure stands on -->
            <ellipse class="pg-floor" cx="240" cy="512" rx="176" ry="22"></ellipse>
          </svg>

          <div class="gateway-character" data-portal-character data-state="base" aria-hidden="true"></div>
        </div>

        <!-- THE RIGHT DOOR — the academic and professional world -->
        <a class="portal-door portal-door--acad" href="academic.html" data-portal-path="academic" data-i18n-aria="portal.enterAcad" aria-label="ادخل العالم الأكاديمي والمهني">
          <span class="door-world" aria-hidden="true">
            <span class="portal-orb"></span>
            <svg class="portal-chart" viewBox="0 0 200 120" fill="none" focusable="false">
              <path class="portal-chart-axis" d="M16 8V112H192"></path>
              <path class="portal-chart-line" d="M16 92C40 88 52 62 76 58C98 54 108 34 132 30C154 26 172 20 192 14"></path>
            </svg>
            <span class="portal-star portal-star--a"></span>
            <span class="portal-star portal-star--b"></span>
            <span class="portal-star portal-star--c"></span>
          </span>
          <span class="portal-door-words">
            <span class="portal-door-name" data-i18n="portal.pathAcad">العالم الأكاديمي والمهني</span>
            <span class="portal-door-sub" data-i18n="portal.pathAcadSub">حسين — الأكاديمي</span>
          </span>
        </a>

      </div>
    </div>
  </section>

</main>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/scroll.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/page.js"></script>
<script src="assets/js/portal.js"></script>
</body>
</html>
